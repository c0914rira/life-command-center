<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>生活司令塔 PoC</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;margin:0;background:#f7f7f5;color:#222}main{max-width:680px;margin:auto;padding:20px 16px 60px}.sub{color:#777;font-size:13px}.box{background:#fff;border-radius:18px;padding:14px;margin:14px 0;box-shadow:0 2px 10px #0000000d}.row{display:flex;gap:8px}.input{flex:1;border:1px solid #ddd;border-radius:12px;padding:13px;font-size:16px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:700;background:#222;color:#fff}.tabs{display:flex;gap:8px;margin:16px 0}.tab{flex:1;padding:11px;border:0;border-radius:12px;background:#e9e9e6}.tab.on{background:#222;color:#fff}.task{border:1px solid #eee;border-radius:15px;padding:13px;margin:9px 0;background:#fff}.top{display:flex;justify-content:space-between;gap:10px}.title{font-weight:700}.badge{font-size:12px;white-space:nowrap}.mustplus{color:#d11}.must{color:#c45d00}.want{color:#9a7400}.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.small{padding:8px 10px;border:1px solid #ddd;border-radius:9px;background:#fafafa}.empty{color:#888;text-align:center;padding:22px}.note{font-size:12px;color:#777;line-height:1.6}</style></head><body><main><h1>生活司令塔 🏠</h1><div class="sub">PoC：まずは「考えずに放り込む」を試す</div><div class="box"><div class="row"><input id="input" class="input" placeholder="思いついたことをそのまま入力"><button id="add" class="btn">追加</button></div><div class="note">分類は仮AI。あとから分類を直すと、このPoC内で覚えます。</div></div><div class="tabs"><button id="todayTab" class="tab on">今日</button><button id="weekTab" class="tab">今週</button><button id="allTab" class="tab">Inbox</button></div><section id="app"></section><div class="box"><b>ルーティン</b><div class="task"><div class="title">🚽 トイレ掃除</div><div class="sub">週1回・金曜目安</div><div class="actions"><button class="small" onclick="routineDone()">今週やった</button></div></div></div><div class="note">MVP：Googleカレンダー・通知・音声入力・外部AI連携はまだありません。</div></main><script>
const KEY='life-command-center-v2';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{tasks:[['御祝儀用のピン札用意','mustplus'],['VIVANTイマーシブ予約する','mustplus'],['そばちゃんへのプレゼント考える','must'],['歯ブラシ交換','must'],['洗顔フォーム買う','must'],['おしゃれ着洗いする','must'],['シャワーのノズル クエン酸掃除','must'],['部屋片付けたい','must'],['柔軟剤買う','must'],['Amazon1000pt使わなきゃ','must'],['枕買う','want'],['null2調べる','want'],['ハリポタ遊びに行く','want'],['カードケース買う','want']].map((x,i)=>({id:Date.now()+i,text:x[0],cat:x[1],done:false,created:Date.now()}))};let view='today';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function classify(t){let s=t.toLowerCase();if(/御祝儀|ピン札|予約|期限|締切|結婚式/.test(s))return'mustplus';if(/買う|交換|掃除|洗い|片付け|プレゼント|使わなきゃ/.test(s))return'must';return'want'}
function add(){let el=document.getElementById('input'),t=el.value.trim();if(!t)return;state.tasks.push({id:Date.now(),text:t,cat:classify(t),done:false,created:Date.now()});el.value='';save();render()}
document.getElementById('add').onclick=add;document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
function catLabel(c){return c==='mustplus'?'🔥 MUST+':c==='must'?'🔴 MUST':'🟡 WANT'}
function visibleToday(){let active=state.tasks.filter(x=>!x.done);let mp=active.filter(x=>x.cat==='mustplus'),m=active.filter(x=>x.cat==='must'),w=active.filter(x=>x.cat==='want');return [...mp,...m].slice(0,3).concat(w.slice(0,1))}
function card(t){return `<div class="task"><div class="top"><div class="title">${esc(t.text)}</div><div class="badge ${t.cat}">${catLabel(t.cat)}</div></div><div class="actions"><button class="small" onclick="done(${t.id})">✓ 完了</button><button class="small" onclick="cycle(${t.id})">分類を変更</button><button class="small" onclick="later(${t.id})">明日へ</button></div></div>`}
function done(id){let t=state.tasks.find(x=>x.id===id);if(t)t.done=true;save();render()}
function later(id){let t=state.tasks.find(x=>x.id===id);if(t){t.created=Date.now();t.later=true}save();render()}
function cycle(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;t.cat=t.cat==='mustplus'?'must':t.cat==='must'?'want':'mustplus';save();render()}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.getElementById('todayTab').classList.toggle('on',view==='today');document.getElementById('weekTab').classList.toggle('on',view==='week');document.getElementById('allTab').classList.toggle('on',view==='all');let app=document.getElementById('app');if(view==='today'){let a=visibleToday();app.innerHTML='<div class="box"><b>今日</b><div class="sub">最大3つ＋WANTは1つだけ。完了すると次が出る。</div>'+(a.length?a.map(card).join(''):'<div class="empty">今日の候補はないよ 🎉</div>')+'</div>'}else if(view==='week'){let a=state.tasks.filter(x=>!x.done);app.innerHTML='<div class="box"><b>今週</b>'+(a.length?a.map(card).join(''):'<div class="empty">全部片付いた！</div>')+'</div>'}else{app.innerHTML='<div class="box"><b>Inbox</b>'+(state.tasks.length?state.tasks.map(card).join(''):'<div class="empty">まだ何もないよ</div>')+'</div>'}}
document.getElementById('todayTab').onclick=()=>{view='today';render()};document.getElementById('weekTab').onclick=()=>{view='week';render()};document.getElementById('allTab').onclick=()=>{view='all';render()};function routineDone(){alert('今週のトイレ掃除、完了！')}render();
</script></body></html>
